server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O app inteiro é o index.html e muda a cada deploy: o navegador
    # confere com o servidor antes de reaproveitar a cópia guardada.
    location / {
        add_header Cache-Control "no-cache";
    }
}
